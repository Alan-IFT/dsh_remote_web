# nginx TLS terminator for the relay, for hosts that already run nginx.
#
# Two settings below are not optional. `proxy_buffering off` keeps the DSH
# event downlink flowing instead of arriving in bursts, and the Upgrade/
# Connection pair is what makes WebSocket proxying work at all — without them
# the surface loads but never updates.

upstream dsh_remote_web {
    server 127.0.0.1:8787;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Image prompts travel as request bodies; the relay bounds them itself.
    client_max_body_size 200m;

    location / {
        proxy_pass http://dsh_remote_web;
        proxy_http_version 1.1;

        # WebSocket upgrade plumbing for /api/events.mux and /api/events.host.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming, not buffering: the agent pushes events as they happen.
        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
